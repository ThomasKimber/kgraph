name: Push Workflow

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install uv
        uv sync --frozen
        uv pip install -e .

    - name: Analyse code with pylint
      run: |
        uv run --no-extra gravis pylint $(git ls-files 'src/kgraphing/*.py') --fail-under=7.5 --recursive=y
    - name: Perform unit testing with pytest - fail if coverage < 75%
      run: |
        uv run --no-extra gravis pytest --cov=kgraphing --cov-fail-under=75
